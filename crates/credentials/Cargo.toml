[package]
name = "consistent-world-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
consistent-world-common = { path = "../common" }

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
keyring.workspace = true
argon2.workspace = true
aes-gcm.workspace = true
base64.workspace = true
chrono.workspace = true
uuid.workspace = true
rand = "0.8"

# Vault key hierarchy: HKDF-SHA256 for domain-separated subkeys, X25519 for
# wrapping item keys to another user's public key when sharing, zeroize so master
# and user keys do not linger in memory after lock.
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

# TOTP (RFC 6238): the vault generates 2FA codes so it replaces the authenticator
# app rather than only storing its seeds. base32 for the shared secret.
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

# Master-password strength estimation at setup. zxcvbn models real cracking cost
# (dictionaries, keyboard walks, l33t substitutions) far better than a length or
# character-class rule, which is the difference between useful guidance and theatre.
zxcvbn = "3"

[dev-dependencies]
tempfile = { workspace = true }
# `vault_test` hand-builds a version 1 vault file to prove migration works.
aes-gcm.workspace = true
argon2.workspace = true
rand = "0.8"
