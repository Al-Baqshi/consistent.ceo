name: CI

on:
  push:
    branches: [main]
    # Release artifacts are cut from a version tag, never from a branch push —
    # see the `release` job's guard. `release-desktop.yml` has always worked
    # this way; this makes the CLI side agree.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Runs everything, including the Windows job, on demand:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The heavyweight crates (agents pulls in wasmtime, cranelift, surrealdb,
  # chromiumoxide, …) produce enormous debug object files, and linking all the
  # test binaries with lld exhausted the runner's memory/disk — the linker died
  # with a bus error. Dropping debuginfo shrinks the link footprint by an order
  # of magnitude and is harmless for CI, which never opens a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      # Every job used to rebuild ~100k lines and their dependency graph from
      # nothing, ~250 runner-minutes per push, which is what exhausted the
      # private repo's Actions allowance on 9 Sep.
      - uses: Swatinem/rust-cache@v2
      - name: "Install native build deps (crates/screen xcap, crates/audio cpal/alsa)"
        run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libasound2-dev libgbm-dev
      - run: cargo check --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      # Every job used to rebuild ~100k lines and their dependency graph from
      # nothing, ~250 runner-minutes per push, which is what exhausted the
      # private repo's Actions allowance on 9 Sep.
      - uses: Swatinem/rust-cache@v2
      - name: "Install native build deps (crates/screen xcap, crates/audio cpal/alsa)"
        run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libasound2-dev libgbm-dev
      - run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: "Install native build deps (crates/screen xcap, crates/audio cpal/alsa)"
        run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libasound2-dev libgbm-dev
      # `--all-targets` includes test targets, which the plain form skips. It was
      # red for a while on two test-only defects nobody could see, because
      # nothing ever ran this form.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A `.rs` file under crates/gateway/src that no `mod` declares is not
      # compiled at all — not by rustc, not by clippy, not by the tests. It
      # looks maintained and is inert. `entity_onboarding.rs` sat that way for
      # months. The blanket `#![allow(dead_code)]` cannot catch this (the file
      # is never even parsed), so check it directly.
      - name: "Every gateway source file is declared as a module"
        run: |
          missing=0
          for f in crates/gateway/src/*.rs; do
            base=$(basename "$f" .rs)
            case "$base" in lib|main) continue;; esac
            if ! grep -qE "^(pub )?mod ${base};" crates/gateway/src/lib.rs crates/gateway/src/main.rs; then
              echo "::error file=$f::$base is not declared in lib.rs or main.rs, so it is never compiled"
              missing=1
            fi
          done
          exit $missing

  # The desktop app ships a Windows installer, and until this job nothing in CI
  # compiled a single `cfg(windows)` line: every job above runs on Linux. The
  # gateway's Windows paths (PowerShell instead of `sh`, `.cmd` CLI shims, a
  # wake assertion instead of `caffeinate`) and the desktop shell's (SendInput,
  # ConPTY) are only ever type-checked and tested here.
  #
  # Windows runners bill at a multiple of Linux minutes, so this runs on demand
  # (workflow_dispatch) and on release tags rather than on every push.
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      # webauthn-rs → openssl-sys is vendored on windows-msvc (see
      # crates/gateway/Cargo.toml) and OpenSSL's build assembles with nasm.
      # Strawberry Perl, the other requirement, ships on the runner image.
      - name: Install nasm (vendored OpenSSL build dependency)
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests written against a Mac have never run on Windows, so this starts as
      # a burn-down rather than a gate: the result is visible on every run, and
      # `continue-on-error` comes off once it is green.
      - name: cargo test --workspace (burn-down, not yet required)
        continue-on-error: true
        run: cargo test --workspace
      # The Tauri shell is its own workspace. `tauri-build` insists that every
      # declared sidecar exists, so stand in empty files for the ones the
      # release workflow builds for real.
      - name: Placeholder sidecars for the desktop shell
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          for bin in consistent-world consistent-whisper; do
            touch "desktop/src-tauri/binaries/${bin}-x86_64-pc-windows-msvc.exe"
          done
      - name: Desktop shell — check and test
        working-directory: desktop/src-tauri
        run: |
          cargo check --all-targets
          cargo test

  docker:
    # Tag pushes only: publish the single-container image (embedded database,
    # see the Dockerfile header) to GitHub's container registry as
    # ghcr.io/<owner>/<repo>:<tag> and :latest. amd64 only: an emulated arm64
    # Rust build would take hours on a hosted runner.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, clippy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        # GHCR names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Tag pushes only. Building release binaries for every commit on main made
    # `main` double as a publish trigger — the job attaches CLI tarballs to the
    # release `install.sh` downloads from, so any merge could change what a
    # stranger installs. Cutting a release is a deliberate `git tag v…`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, clippy]
    # Uploads its binaries to the tag's GitHub release.
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs, cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - name: "Install native build deps (crates/screen xcap, crates/audio cpal/alsa)"
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libasound2-dev libgbm-dev

      # The gateway embeds the dashboard at compile time: crates/gateway/build.rs
      # copies sveltfront/build into crates/gateway/dashboard_build for
      # include_dir!. So the SPA has to exist *before* cargo runs — otherwise the
      # binary serves the "Dashboard not embedded" stub, which is what every
      # tarball / Homebrew install shipped until now.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sveltfront/package-lock.json
      - name: Install dashboard deps
        working-directory: sveltfront
        run: npm ci
      - name: Build dashboard SPA
        working-directory: sveltfront
        run: npm run build

      # Only the gateway binary is packaged below, so build just that package.
      - run: cargo build --release -p consistent-world-gateway --features dashboard --target ${{ matrix.target }}

      # Optional: macOS code signing (set APPLE_SIGNING_IDENTITY secret to enable)
      - name: Sign macOS binary (optional)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            cargo install rcodesign
            rcodesign sign target/${{ matrix.target }}/release/consistent-world --signing-identity "$APPLE_SIGNING_IDENTITY"
          fi

      # Create tarball for Linux/macOS (for install.sh and Homebrew)
      - name: Create tarball (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/consistent-world staging/
          tar -czvf consistent-world-${{ matrix.target }}.tar.gz -C staging consistent-world
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'windows-latest'
        with:
          name: consistent-world-${{ matrix.target }}
          path: consistent-world-${{ matrix.target }}.tar.gz

      # Attach the binary to this tag's GitHub release, which `install.sh`
      # downloads from (`releases/latest/download/<file>`). The release itself
      # is created as a draft by release-desktop.yml's first finished platform
      # and published once all of them succeed, so this waits for it to exist.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            f="consistent-world-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/consistent-world.exe" "$f"
          else
            f="consistent-world-${{ matrix.target }}.tar.gz"
          fi
          for attempt in $(seq 1 60); do
            if gh release upload "${{ github.ref_name }}" "$f" --clobber --repo "${{ github.repository }}"; then
              echo "Attached $f"
              exit 0
            fi
            echo "Release ${{ github.ref_name }} not there yet (attempt $attempt); waiting 60s"
            sleep 60
          done
          echo "::error::No release for ${{ github.ref_name }} after an hour; is release-desktop.yml running?"
          exit 1
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: consistent-world-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/consistent-world*.exe

      # Optional: Windows .msi installer (cargo-wix)
      - name: Build Windows MSI (optional)
        id: wix
        if: matrix.os == 'windows-latest'
        run: |
          cargo install cargo-wix
          cd crates/gateway && cargo wix init && cargo wix --features dashboard
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && steps.wix.outcome == 'success'
        with:
          name: consistent-world-${{ matrix.target }}-msi
          path: crates/gateway/target/wix/**/*.msi
