[workspace]
resolver = "2"
members = [
    "crates/gateway",
    "crates/agents",
    "crates/llm",
    "crates/memory",
    "crates/tools",
    "crates/plugins",
    "crates/credentials",
    "crates/common",
    "crates/audio",
    "crates/a2f",
    "crates/architect",
    "crates/relay",
    "crates/screen",
    "plugins/hello-world",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Al-Baqshi/consistent.ceo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
hyper = "1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
surrealdb = { version = "2", features = ["kv-mem", "kv-surrealkv"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
wasmtime = "28"
keyring = "3"
cron = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
dashmap = "6"
cpal = "0.15"
rubato = "0.16"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
base64 = "0.22"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
